[package]
name = "kc-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core logic for @kryxjs/core — buffers, pipelines, sync, I/O"

[dependencies]
# Async
tokio = { workspace = true }
async-trait = { workspace = true }

# Errors
thiserror = { workspace = true }
anyhow = { workspace = true }

# Memory / buffers
bytes = { workspace = true }
bytemuck = { workspace = true }
bitflags = { workspace = true }
parking_lot = { workspace = true }
arc-swap = { workspace = true }
crossbeam-channel = { workspace = true }
smallvec = { workspace = true }

# Logging
tracing = { workspace = true }

# Serde (optional)
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

# Real GPU backend (optional, behind the `gpu-wgpu` feature).
# Pinned to a known API; bump on your machine if your wgpu is newer.
wgpu = { version = "0.20", optional = true }
pollster = { version = "0.3", optional = true }

[features]
default = []
serde = ["dep:serde", "dep:serde_json"]
# Emit a `tracing` span around every stage execution (Phase 3 observability).
# Off by default: zero cost when not enabled; turn on for debugging/profiling.
trace-spans = []
# Real GPU backend over wgpu (Vulkan/Metal/D3D12). Off by default: the crate
# builds and tests on the CPU fallback without it. Enable on a machine with a
# GPU: `cargo build --features gpu-wgpu`.
gpu-wgpu = ["dep:wgpu", "dep:pollster"]
# Link against real Zig modules. Without this feature, internal stubs are used,
# so the crate is always usable for development and testing.
link-zig = []

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_must_use = "warn"
# Silence harmless dead_code from API surface that's exposed for downstream crates
# but not yet used internally (sync helpers, FFI helpers, builder fields).
dead_code = "allow"

[lints.clippy]
all = "warn"
pedantic = "allow"
module_name_repetitions = "allow"

[dev-dependencies]
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "buffer_pool"
harness = false

[[bench]]
name = "decoder_loop"
harness = false

[[bench]]
name = "threading"
harness = false
